
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>3D Gallery — ABBASOV</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>

<body>
    <a-scene
        background="color: #ECEFF4"
        renderer="colorManagement: true">

        <!-- Загрузка модели Blender -->
        <a-assets>
            <a-asset-item
                id="gallery"
                src="models/Без имени.glb">
            </a-asset-item>
        </a-assets>

        <!-- Наша 3D-выставка -->
        <a-entity
            gltf-model="#gallery"
            position="0 0 0"
            rotation="0 0 0"
            scale="1 1 1">
        </a-entity>

        <!-- Освещение -->
        <a-entity
            light="type: ambient; color: #FFFFFF; intensity: 0.8">
        </a-entity>

        <a-entity
            light="type: directional; color: #FFFFFF; intensity: 1.2"
            position="-3 8 5">
        </a-entity>

        <!-- Камера посетителя -->
        <a-entity position="0 2.2 9">
            <a-camera
                look-controls="enabled: true"
                wasd-controls="enabled: true">
            </a-camera>
        </a-entity>

    </a-scene>
</body>
</html>
